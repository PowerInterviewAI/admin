[project]
name = "power-interview-admin"
version = "0.1.0"
description = "Admin dashboard API for the Power Interview AI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.133.0",
    "loguru==0.7.3",
    "pydantic-settings==2.11.0",
    "pymongo==4.15.3",
    "uvicorn==0.38.0",
]

[dependency-groups]
dev = [
    "mypy==1.18.2",
    "ruff==0.14.3",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".venv"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # conflicts with ruff format
    "D",  # docstring coverage: not required here
    "ISC001",  # conflicts with ruff format
    "PLR0913",  # too-many-arguments: explicit typed kwargs preferred over param objects
    "UP040",  # type X = ...: keep `TypeAlias` for parity with backend
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
